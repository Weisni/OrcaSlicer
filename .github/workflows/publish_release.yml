name: Publish to draft release

# Pulls the platform binaries produced by a successful main build and uploads
# them to the matching DRAFT release. Completed main builds are published
# automatically when their exact commit has a prepared draft release. Manual
# dispatch remains available for explicitly selected historical runs.
#
# Trigger: Actions tab -> "Publish to draft release" -> Run workflow.
# Locked to a single person: the first step aborts unless the actor matches the
# `RELEASE_PUBLISHER` repo variable (set to "Weisni"). To allow someone else,
# change that variable: gh variable set RELEASE_PUBLISHER --body "<login>".

on:
  workflow_run:
    workflows: ["Build QuackSlicer"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID of the "Build all" workflow to pull binaries from (the number in the Actions run URL)'
        required: true
        type: string
      tag:
        description: 'Tag of the draft release to upload to (e.g. v2.4.0-beta)'
        required: true
        type: string

permissions:
  contents: write   # upload release assets
  actions: read     # download artifacts from another run

jobs:
  publish:
    name: Publish binaries to draft release
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Resolve source run and release tag
        env:
          DISPATCH_RUN_ID: ${{ inputs.run_id }}
          DISPATCH_TAG: ${{ inputs.tag }}
          COMPLETED_RUN_ID: ${{ github.event.workflow_run.id }}
          COMPLETED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            run_id="$DISPATCH_RUN_ID"
            tag="$DISPATCH_TAG"
          else
            run_id="$COMPLETED_RUN_ID"
            tag=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
              --jq ".[] | select(.draft == true and .target_commitish == \"$COMPLETED_HEAD_SHA\") | .tag_name" \
              | head -n 1)
            if [ -z "$tag" ]; then
              echo "No draft release targets $COMPLETED_HEAD_SHA; nothing to publish."
              echo "PUBLISH=false" >> "$GITHUB_ENV"
              exit 0
            fi
          fi
          echo "PUBLISH=true" >> "$GITHUB_ENV"
          echo "RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "Resolved build run #$run_id and release $tag"

      - name: Restrict to the release publisher
        if: ${{ env.PUBLISH == 'true' && github.event_name == 'workflow_dispatch' }}
        env:
          PUBLISHER: ${{ vars.RELEASE_PUBLISHER }}
        run: |
          if [ -z "$PUBLISHER" ]; then
            echo "::error::RELEASE_PUBLISHER repo variable is not set."
            exit 1
          fi
          if [ "${{ github.actor }}" != "$PUBLISHER" ]; then
            echo "::error::Only @$PUBLISHER may run this workflow (you are @${{ github.actor }})."
            exit 1
          fi
          echo "Authorized: @${{ github.actor }}"

      - name: Verify target is a draft release
        if: ${{ env.PUBLISH == 'true' }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft >/dev/null 2>&1; then
            echo "::error::Release '$TAG' not found. Create the draft (with this tag) first."
            exit 1
          fi
          is_draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')
          if [ "$is_draft" != "true" ]; then
            echo "::error::Release '$TAG' is published, not a draft. Aborting to avoid touching a live release."
            exit 1
          fi

      - name: Verify source build run
        if: ${{ env.PUBLISH == 'true' }}
        run: |
          info=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json workflowName,conclusion,headBranch,headSha)
          name=$(echo "$info" | jq -r '.workflowName')
          conclusion=$(echo "$info" | jq -r '.conclusion')
          branch=$(echo "$info" | jq -r '.headBranch')
          head_sha=$(echo "$info" | jq -r '.headSha')
          release_target=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json targetCommitish --jq '.targetCommitish')
          release_target_sha=$(gh api \
            "repos/$GITHUB_REPOSITORY/commits/$release_target" --jq '.sha')
          echo "Source run #$RUN_ID: '$name' on '$branch' at $head_sha (conclusion: $conclusion)"
          if [ "$name" != "Build QuackSlicer" ] || [ "$branch" != "main" ]; then
            echo "::error::Source run must be the 'Build QuackSlicer' workflow on main."
            exit 1
          fi
          if [ "$conclusion" != "success" ]; then
            echo "::error::Source run did not conclude 'success' ($conclusion). Refusing to publish an incomplete release."
            exit 1
          fi
          if [ "$head_sha" != "$release_target_sha" ]; then
            echo "::error::Source run SHA $head_sha does not match draft release target $release_target_sha ($release_target)."
            exit 1
          fi

      - name: Download release artifacts from build run
        if: ${{ env.PUBLISH == 'true' }}
        run: |
          # Windows_V* (not Windows_*) keeps the MSIX Store artifact out: it goes to Partner Center, not GitHub releases.
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --dir artifacts \
            -p 'QuackSlicer_Windows_V*' \
            -p 'QuackSlicer_Mac_universal_*' \
            -p 'QuackSlicer_Linux_ubuntu_*' \
            -p 'PDB'
          echo "Downloaded artifact folders:"
          ls -1 artifacts

      - name: Assemble release assets
        if: ${{ env.PUBLISH == 'true' }}
        run: |
          set -euo pipefail
          mkdir -p upload

          # gh run download auto-extracts each artifact into a folder, so the inner
          # binaries are already unzipped. Copy the inner binary for each platform.
          # -type f is required (some artifact *folders* are named "*.flatpak").

          # Windows installers (x64 + arm64): the .exe inside each installer
          # artifact, NOT the quack-slicer.exe in the portable app folder. CPack
          # bakes the arch into the filename, so
          # copy them straight through.
          find artifacts -type f \( -name '*.exe' -o -name '*.exe.sha256' \) -path '*QuackSlicer_Windows_*' ! -path '*_portable*' -exec cp -v {} upload/ \;
          # macOS universal DMG (profile-validator DMG isn't downloaded).
          find artifacts -type f -name '*.dmg' -path '*QuackSlicer_Mac_universal_*' -exec cp -v {} upload/ \;
          # Linux AppImage.
          find artifacts -type f -name '*.AppImage' -exec cp -v {} upload/ \;
          # Windows debug symbols (PDB archive, for developers).
          find artifacts -type f -name 'Debug_PDB_*.7z' -exec cp -v {} upload/ \;

          # Portable Windows builds (x64 + arm64) are unzipped folder artifacts;
          # re-zip each to its released filename (these stay .zip on the release).
          mapfile -t portable_dirs < <(find artifacts -maxdepth 1 -type d -name 'QuackSlicer_Windows_*_portable')
          if [ ${#portable_dirs[@]} -eq 0 ]; then
            echo "::warning::Windows portable artifact not found."
          fi
          for portable_dir in "${portable_dirs[@]}"; do
            ( cd "$portable_dir" && zip -qr "$GITHUB_WORKSPACE/upload/$(basename "$portable_dir").zip" . )
            echo "Zipped portable -> $(basename "$portable_dir").zip"
          done

          echo "Assets to upload:"
          ls -lh upload
          if [ -z "$(ls -A upload)" ]; then
            echo "::error::No assets assembled. Check the run_id and that its artifacts haven't expired."
            exit 1
          fi

      - name: Upload assets to draft release
        if: ${{ env.PUBLISH == 'true' }}
        run: |
          gh release upload "$TAG" upload/* --repo "$GITHUB_REPOSITORY" --clobber
          echo "Uploaded to draft release: $TAG"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'

      - name: Publish verified release
        if: ${{ env.PUBLISH == 'true' && github.event_name == 'workflow_run' }}
        run: |
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          echo "Published release: $TAG"
