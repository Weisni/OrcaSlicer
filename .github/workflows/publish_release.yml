name: Publish to draft release

# Reuse the artifacts of a successful Build QuackSlicer run on main.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful main build run ID
        required: true
        type: string
      tag:
        description: Tag of the existing draft release
        required: true
        type: string
      publish:
        description: Publish after verifying the uploaded draft assets
        type: boolean
        default: false

concurrency:
  group: release-publisher
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Upload verified release assets
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RUN_ID: ${{ inputs.run_id }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Restrict to the release publisher
        env:
          PUBLISHER: ${{ vars.RELEASE_PUBLISHER }}
        run: |
          if [[ -z "$PUBLISHER" || "$GITHUB_ACTOR" != "$PUBLISHER" ]]; then
            echo "::error::Only the configured RELEASE_PUBLISHER may run this workflow."
            exit 1
          fi

      - name: Find the successful main build and the draft release
        run: |
          set -euo pipefail
          if [[ ! "$RUN_ID" =~ ^[1-9][0-9]*$ || ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9]+([.-][A-Za-z0-9]+)*)?$ ]]; then
            echo "::error::Provide a numeric build run ID and a version tag such as v2.5.26."
            exit 1
          fi
          repo="repos/$GITHUB_REPOSITORY"
          workflow_id=$(gh api "$repo/actions/workflows/build_all.yml" --jq '.id')
          source=$(gh api "$repo/actions/runs/$RUN_ID")
          head_sha=$(jq -er --arg repo "$GITHUB_REPOSITORY" --argjson workflow "$workflow_id" '
            select(.workflow_id == $workflow and .head_repository.full_name == $repo
                   and .head_branch == "main" and .conclusion == "success"
                   and (.event == "push" or .event == "workflow_dispatch")) | .head_sha' <<< "$source") || {
            echo "::error::Source run must be a successful Build QuackSlicer push or manual run on main."
            exit 1
          }
          gh api --paginate --slurp "$repo/actions/runs/$RUN_ID/jobs?filter=latest&per_page=100" > build-jobs.json
          jq -e '
            [.[] | .jobs[] | select(.name | startswith("Home Assistant materials regression gate /")) | .conclusion] == ["success"]
            and ([.[] | .jobs[] | select(.name | startswith("Windows x64 /")) | .conclusion] == ["success"])
          ' build-jobs.json >/dev/null || {
            echo "::error::The exact build requires successful HA and Windows x64 unit tests."
            exit 1
          }
          # The REST endpoint by tag can return 404 for an unpublished draft.
          release_id=$(gh api --paginate --slurp "$repo/releases?per_page=100" |
            jq -er --arg tag "$TAG" '
              [.[][] | select(.draft == true and .tag_name == $tag)] |
              if length == 1 then .[0].id else error("Expected one matching release draft") end')
          echo "RELEASE_HEAD_SHA=$head_sha" >> "$GITHUB_ENV"
          echo "RELEASE_ID=$release_id" >> "$GITHUB_ENV"

      - name: Checkout the publisher at the workflow SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Read version.inc at the build SHA
        run: |
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$GITHUB_REPOSITORY/contents/version.inc?ref=$RELEASE_HEAD_SHA" > release-version.inc

      - name: Verify draft target and immutable tag
        run: python3 scripts/verify_release_target.py --repo "$GITHUB_REPOSITORY" --release-id "$RELEASE_ID" --tag "$TAG" --head "$RELEASE_HEAD_SHA"

      - name: Download the existing build artifacts
        run: |
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --dir artifacts \
            -p 'QuackSlicer_Windows_V*' \
            -p 'QuackSlicer_Mac_universal_*' \
            -p 'QuackSlicer_Linux_ubuntu_*' \
            -p 'QuackSlicer-Linux-flatpak_*' \
            -p 'PDB' \
            -p 'release-matrix'

      - name: Assemble and verify the selected asset matrix
        run: |
          set -euo pipefail
          mkdir upload
          find artifacts -type f \( -name '*.exe' -o -name '*.exe.sha256' \) \
            -path '*QuackSlicer_Windows_*' ! -path '*_portable*' -exec cp -v {} upload/ \;
          find artifacts -type f \( -name 'QuackSlicer_Windows_*_portable.zip' -o -name '*.dmg' \
            -o -name '*.AppImage' -o -name '*.flatpak' -o -name 'Debug_PDB_*.7z' \) -exec cp -v {} upload/ \;
          # Older builds stored the portable application tree instead of the final ZIP.
          for dir in artifacts/QuackSlicer_Windows_*_portable; do
            [[ -d "$dir" ]] || continue
            archive="$GITHUB_WORKSPACE/upload/$(basename "$dir").zip"
            if [[ ! -f "$archive" ]]; then
              (cd "$dir" && zip -qr "$archive" .)
            fi
          done
          python3 scripts/validate_release_assets.py upload --tag "$TAG" \
            --version-file release-version.inc --matrix-file artifacts/release-matrix/release-matrix.json \
            --head "$RELEASE_HEAD_SHA"
          (cd upload && sha256sum --check SHA256SUMS)

      - name: Upload and verify draft assets
        run: |
          set -euo pipefail
          release="repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
          python3 scripts/verify_release_target.py --repo "$GITHUB_REPOSITORY" --release-id "$RELEASE_ID" --tag "$TAG" --head "$RELEASE_HEAD_SHA"
          gh api "$release" > draft.json
          for asset in upload/*; do
            name=${asset##*/}
            digest=$(sha256sum "$asset" | cut -d' ' -f1)
            existing=$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .digest // "unverified"' draft.json)
            if [[ "$existing" == "sha256:$digest" ]]; then
              continue
            fi
            if [[ -n "$existing" ]]; then
              echo "::error::Draft already has a different or incomplete $name."
              exit 1
            fi
            query=$(jq -rn --arg name "$name" '$name | @uri')
            curl --silent --show-error --fail-with-body --output /dev/null \
              -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/octet-stream" \
              --data-binary "@$asset" "https://uploads.github.com/$release/assets?name=$query"
          done
          gh api "$release" > release-assets.json
          python3 scripts/validate_release_assets.py upload --tag "$TAG" \
            --version-file release-version.inc --matrix-file artifacts/release-matrix/release-matrix.json \
            --head "$RELEASE_HEAD_SHA" --remote-json release-assets.json

      - name: Publish verified release
        if: inputs.publish
        run: |
          set -euo pipefail
          python3 scripts/verify_release_target.py --repo "$GITHUB_REPOSITORY" --release-id "$RELEASE_ID" \
            --tag "$TAG" --head "$RELEASE_HEAD_SHA" --create-tag --require-tag
          latest=true
          if [[ "$TAG" == *-* ]]; then latest=false; fi
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false -f "make_latest=$latest" --jq '.html_url'
