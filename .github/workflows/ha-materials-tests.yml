name: Home Assistant materials tests

on:
  pull_request:
    paths:
      - 'tools/ha-material-demo/**'
      - '.github/workflows/ha-materials-tests.yml'
  push:
    branches: [main]
    paths:
      - 'tools/ha-material-demo/**'
      - '.github/workflows/ha-materials-tests.yml'

permissions:
  contents: read

jobs:
  component:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/ha-material-demo
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install -r demo/requirements.txt
      - name: Test inventory and recovery
        env:
          PYTHONPATH: demo
        run: python -m unittest discover -s demo/tests -p 'test_*.py'
      - name: Test dashboard controls and NFC navigation
        run: |
          for test in demo/tests/test_*.cjs; do
            node "$test"
          done
